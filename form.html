<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pendaftaran | Arthessmd</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head>
<body><div class="wrap" style="max-width:640px"><header class="hero"><img class="logo" src="logo.png" alt="Arthessmd"><h1 id="t">Pendaftaran</h1><p class="mut" id="d"></p><p id="info" style="color:var(--gold)"></p></header>
<form id="f" class="panel" hidden>
<fieldset id="fsTeam" hidden disabled>
<label>Nama tim</label><input id="tn" required><label>Nama leader</label><input id="ld" required>
<label>No. WhatsApp</label><input id="wa" type="tel" placeholder="08xxxxxxxxxx atau +62..." required><label>ID game leader</label><input id="gid" inputmode="numeric" required>
<label>Nickname pemain 1</label><input id="p1" required><label>Nickname pemain 2</label><input id="p2" required><label>Nickname pemain 3</label><input id="p3" required>
<label>Nickname pemain 4</label><input id="p4" required><label>Nickname pemain 5</label><input id="p5" required>
<label>Cadangan (boleh kosong, pisahkan dengan koma)</label><input id="sb">
</fieldset>
<fieldset id="fsSolo" hidden disabled>
<label>Nama</label><input id="sn" required autocomplete="name">
<label>ID game</label><input id="sid" inputmode="numeric" required>
<label>No. WhatsApp</label><input id="sw" type="tel" placeholder="08xxxxxxxxxx atau +62..." required>
</fieldset>
<p class="mut">Link ini hanya bisa dipakai satu kali. Pastikan data sudah benar sebelum mengirim.</p>
<div class="row"><button class="on" id="go">Kirim pendaftaran</button></div></form>
<div id="msg" class="panel" hidden></div></div>
<script src="config.js"></script>
<script>
const tk=new URLSearchParams(location.search).get('t');let S;
const say=h=>{$('#f').hidden=true;$('#msg').hidden=false;$('#msg').innerHTML=h};
const solo=()=>S&&S.kind==='solo';
const waOk=w=>/^\+?\d{9,15}$/.test(w.replace(/[\s-]/g,''));
const dead={
 invalid:'<b>Link tidak valid.</b> Minta link baru kepada panitia.',
 used:'<b>Link ini sudah dipakai.</b> Setiap link hanya bisa digunakan satu kali.',
 closed:'<b>Pendaftaran sudah ditutup.</b>',
 full:'<b>Kuota penuh.</b> Pendaftaran tidak dapat dilanjutkan.'};
(async()=>{
 if(!tk)return say(dead.invalid);
 const {data,error}=await db.rpc('check_invite',{p_token:tk});
 if(error||!data)return say('<b>Gagal memuat form.</b> Coba muat ulang halaman.');
 S=data;
 if(S.status==='invalid')return say(dead.invalid);
 $('#t').textContent='Pendaftaran '+(solo()?'Solo ':'')+S.title;$('#d').textContent=S.description||'';
 if(S.status!=='ok')return say(dead[S.status]);
 if(S.quota)$('#info').textContent='Sisa slot '+(solo()?'solo':'tim')+': '+Math.max(0,S.quota-S.count);
 const on=$(solo()?'#fsSolo':'#fsTeam');on.hidden=false;on.disabled=false;
 $('#f').hidden=false})();
$('#f').onsubmit=async e=>{e.preventDefault();const go=$('#go');go.disabled=true;
 const v=k=>$('#'+k).value.trim(),bad=m=>{alert(m);go.disabled=false};
 let args,label;
 if(solo()){
  if(!waOk(v('sw')))return bad('Nomor WhatsApp tidak valid.');
  label=v('sn');args={p_token:tk,p_team:null,p_leader:label,p_wa:v('sw'),p_gid:v('sid'),p_players:[],p_subs:[]};
 }else{
  if(!waOk(v('wa')))return bad('Nomor WhatsApp tidak valid.');
  label=v('tn');args={p_token:tk,p_team:label,p_leader:v('ld'),p_wa:v('wa'),p_gid:v('gid'),
   p_players:[1,2,3,4,5].map(k=>v('p'+k)),p_subs:v('sb').split(',').map(s=>s.trim()).filter(Boolean)};
 }
 const {data:res,error}=await db.rpc('submit_registration',args);
 if(error)return bad('Gagal mengirim: '+error.message);
 const r=res&&res.status;
 if(r==='duplicate')return bad(solo()?'ID game ini sudah terdaftar untuk tanggal ini.':'Nama tim sudah terdaftar. Gunakan nama lain.');
 if(r==='incomplete')return bad('Semua kolom wajib diisi.');
 if(r!=='ok')return say(dead[r]||dead.invalid);
 const gl=/^https?:\/\//i.test(res.group_link||'')?res.group_link:'';
 say(`<h2 style="margin-top:0">Berhasil mendaftar</h2><p>${solo()?'Peserta solo':'Tim'} <b>${esc(label)}</b> sudah terdaftar untuk ${esc(S.title)}.</p>${res.note?`<p>${esc(res.note)}</p>`:''}${gl?`<p>Silakan gabung ke grup berikut:</p><div class="row"><a class="btn gold" href="${esc(gl)}" target="_blank" rel="noopener">Gabung grup</a></div><p class="mut" style="word-break:break-all">${esc(gl)}</p>`:''}<p class="mut">Link pendaftaran ini sudah tidak bisa dipakai lagi. Simpan link grup di atas atau screenshot halaman ini, karena tidak akan ditampilkan lagi.</p>`)};
</script></body></html>
